name: Java CI with Gradle (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      # Если ваш проект лежит в подпапке, раскомментируйте строчку ниже и впишите имя папки:
      # working-directory: ИМЯ_ВАШЕЙ_ПАПКИ
      run: .\gradlew.bat build
